# HyperOS Hyprland Configuration
# ~/.config/hypr/hyprland.conf
#
# This is a base configuration. Full customization will be added later.

monitor=,preferred,auto,1

exec-once = hyprpaper & waybar & swaync & hypridle

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(00AEEFff)
    col.inactive_border = rgba(2D2D2Dff)
    layout = dwindle
    cursor_inactive_timeout = 3
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
    }
}

animations {
    enabled = true
    bezier = hyper, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, hyper, slide
    animation = fade, 1, 4, hyper
    animation = workspaces, 1, 4, hyper, slide
}

windowrule = opacity 0.95 0.90, .* (kitty|foot|alacritty).*

bind = SUPER, Return, exec, kitty
bind = SUPER, Q, killactive
bind = SUPER, M, exit
bind = SUPER, E, exec, dolphin
bind = SUPER, R, exec, rofi -show drun
bind = SUPER, Space, togglefloating
bind = SUPER, F, fullscreen
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER_SHIFT, 1, movetoworkspace, 1
bind = SUPER_SHIFT, 2, movetoworkspace, 2
bind = SUPER_SHIFT, 3, movetoworkspace, 3
bind = SUPER_SHIFT, 4, movetoworkspace, 4
bind = SUPER, mouse:272, movewindow
bind = SUPER, mouse:273, resizewindow
