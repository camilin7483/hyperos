# HyperOS Power Save Performance Profile

[profile]
name = Power Saver
description = Maximum power efficiency for battery life

[cpu]
governor = powersave
scaling_min = 0
scaling_max = 50
boost = false

[gpu]
governor = powersave
power_level = low

[power]
screen_brightness = 40
screen_timeout = 120
suspend_timeout = 300
wifi_save = true
bluetooth_disable = true
