# HyperOS Development Performance Profile

[profile]
name = Development
description = Optimized for compilation and development workloads

[cpu]
governor = performance
scaling_min = 0
scaling_max = 0
boost = true

[gpu]
governor = auto
power_level = auto

[power]
screen_brightness = 80
screen_timeout = 600
suspend_timeout = 1800

[system]
swappiness = 10
fs_writeback = 5000
