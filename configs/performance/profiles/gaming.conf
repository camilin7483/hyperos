# HyperOS Gaming Performance Profile

[profile]
name = Gaming
description = Maximum performance for gaming workloads

[cpu]
governor = performance
scaling_min = 0
scaling_max = 0
boost = true

[gpu]
governor = performance
power_level = high

[power]
screen_brightness = 100
screen_timeout = 0
suspend_timeout = 0

[system]
compositor = auto_offscreen
mangoapp = true
