# HyperOS Sudo Configuration
# /etc/sudoers.d/hyperos

# Defaults
Defaults        !lecture
Defaults        mail_badpass
Defaults        passwd_tries=3
Defaults        env_reset
Defaults        timestamp_timeout=5

# Wheel group
%wheel ALL=(ALL:ALL) ALL

# HyperOS admin group (future)
# %hyperos-admin ALL=(ALL:ALL) ALL
