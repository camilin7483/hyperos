# HyperOS Firewall Configuration
# /etc/hyperos/firewall.conf

[defaults]
input_policy = drop
forward_policy = drop
output_policy = accept

[rules]
# Allow established connections
allow established = true
allow related = true

# Allow loopback
allow loopback = true

# Common services
allow ssh = false
allow http = false
allow https = false
allow dhcp = true
allow dns = true
allow ping = true
