# syslinux configuration for HyperOS
PROMPT 1
TIMEOUT 50

DEFAULT hyperos

LABEL hyperos
    LINUX ../vmlinuz-linux-zen
    INITRD ../initramfs-linux-zen.img
    APPEND archisobasedir=arch archisolabel=HYPEROS_202607

LABEL hyperos-nofb
    LINUX ../vmlinuz-linux-zen
    INITRD ../initramfs-linux-zen.img
    APPEND archisobasedir=arch archisolabel=HYPEROS_202607 nomodeset

LABEL memtest
    LINUX ../memtest86+/memtest.bin

LABEL hdt
    COM32 hdt.c32

LABEL reboot
    COM32 reboot.c32

LABEL poweroff
    COM32 poweroff.c32
