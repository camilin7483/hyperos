# Hyprland configuration for HyperOS
# This is the main configuration file for the Hyprland compositor

# Source common variables
source = ~/.config/hypr/common.conf

# ===========================
# GENERAL SETTINGS
# ===========================

general {
    # Main gaps between windows
    gaps_in = 5
    gaps_out = 10
    
    # Border configuration
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    
    # Cursor settings
    follow_mouse = 1
    
    # Layout settings
    layout = dwindle
    
    # Allow tearing for games
    allow_tearing = true
}

# ===========================
# DECORATIONS
# ===========================

decoration {
    # Rounded corners
    rounding = 8
    
    # Blur effect
    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.2
    }
    
    # Drop shadow
    drop_shadow = true
    shadow_range = 20
    shadow_render_power = 3
    col.shadow = rgba(00000066)
}

# ===========================
# ANIMATIONS
# ===========================

animations {
    enabled = true
    
    # Animation curves and speeds
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = myBezier2, 0.25, 1, 0.5, 1
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    
    animation = windows, 1, 6, myBezier
    animation = windowsOut, 1, 6, myBezier
    animation = border, 1, 10, default
    animation = fade, 1, 7, myBezier
    animation = workspaces, 1, 6, myBezier2
    animation = specialWorkspace, 1, 6, myBezier
}

# ===========================
# INPUT DEVICES
# ===========================

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    
    follow_mouse = 1
    
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        clickfinger_behavior = true
    }
    
    sensitivity = 0
}

# ===========================
# GESTURES
# ===========================

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 10
}

# ===========================
# WINDOW RULES
# ===========================

windowrulev2 = float, class:^(kitty)$, title:^(float_kitty)$
windowrulev2 = size 800 600, class:^(kitty)$, title:^(float_kitty)$
windowrulev2 = center, class:^(kitty)$, title:^(float_kitty)$

# Make dialogs float
windowrulev2 = float, title:(Open|Save|Choose|Select|Download|Upload)

# Fullscreen games
windowrulev2 = fullscreen, class:^(steam)$
windowrulev2 = fullscreen, class:^(Minecraft)$

# ===========================
# WORKSPACES
# ===========================

# Workspace bindings
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER SHIFT, S, movetoworkspace, special:magic

# ===========================
# WINDOW MOVEMENT
# ===========================

# Move windows with keybindings
bind = SUPER CTRL, left, movewindow, l
bind = SUPER CTRL, right, movewindow, r
bind = SUPER CTRL, up, movewindow, u
bind = SUPER CTRL, down, movewindow, d

# Switch windows
bind = SUPER, left, movewindow, l
bind = SUPER, right, movewindow, r
bind = SUPER, up, movewindow, u
bind = SUPER, down, movewindow, d

# ===========================
# RESIZE WINDOWS
# ===========================

binde = SUPER ALT, right, resizeactive, 20 0
binde = SUPER ALT, left, resizeactive, -20 0
binde = SUPER ALT, up, resizeactive, 0 -20
binde = SUPER ALT, down, resizeactive, 0 20

# ===========================
# SYSTEM CONTROLS
# ===========================

# Lock screen
bind = SUPER, L, exec, swaylock

# Logout
bind = SUPER SHIFT, Q, exit

# Kill active window
bind = SUPER ALT, Q, killactive

# Toggle fullscreen
bind = SUPER, F, fullscreen, 0
bind = SUPER SHIFT, F, fullscreen, 1

# Toggle floating
bind = SUPER SHIFT, space, togglefloating

# Focus monitor
bind = SUPER CTRL, 1, focusmonitor, 0
bind = SUPER CTRL, 2, focusmonitor, 1

# Move window to monitor
bind = SUPER SHIFT, 1, movefocus, l
bind = SUPER SHIFT, 2, movefocus, r

# ===========================
# APPLICATION LAUNCHERS
# ===========================

# Terminal
bind = SUPER, Return, exec, kitty

# App launcher (wofi or rofi-wayland)
bind = SUPER, D, exec, wofi --show drun

# File manager
bind = SUPER, E, exec, dolphin

# Web browser
bind = SUPER, B, exec, firefox

# HyperOS applications
bind = SUPER, C, exec, hyper-center
bind = SUPER, I, exec, hyper-settings
bind = SUPER, T, exec, hyper-tools
bind = SUPER, A, exec, hyper-assistant

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png
bind = SUPER, Print, exec, grim ~/Pictures/fullscreen_$(date +%Y%m%d_%H%M%S).png

# Volume control
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness control
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# ===========================
# MOUSE BINDINGS
# ===========================

# Move windows with mouse
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# ===========================
# ENVIRONMENT VARIABLES
# ===========================

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = NIX_SSL_CERT_FILE,/etc/ssl/certs/ca-certificates.crt

# Wayland environment
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1

# ===========================
# AUTO-START APPLICATIONS
# ===========================

# Start Waybar
exec-once = waybar

# Start notification daemon
exec-once = dunst

# Start authentication agent
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Set wallpaper
exec-once = swww-daemon && sleep 2 && swww img ~/Pictures/wallpaper.jpg || true

# Start HyperOS daemon user service
exec-once = systemctl --user start hyperos-daemon.service || true

# Start network applet
exec-once = nm-applet --indicator || true

===========================
# MONITOR CONFIGURATION
# ===========================

# Example monitor configurations (uncomment and adjust as needed)
# monitor=eDP-1, 1920x1080@60, 0x0, 1
# monitor=HDMI-A-1, 2560x1440@144, 1920x0, 1
# monitor=DP-1, 3840x2160@60, 0x0, 1

# Auto-detect and configure monitors
# monitor=,preferred,auto,1
