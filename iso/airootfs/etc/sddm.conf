[SDDM]
# Theme
Theme=hyperos-sddm

# Display settings
EnableHiDPI=true
GreeterEnvironment=QT_QPA_PLATFORM=wayland

# Session
SessionDirectory=/usr/share/wayland-sessions

# User settings
AllowEmptyPassword=false
AutoLoginUser=
AutoLoginSession=

# Logging
LogPath=/var/log/sddm.log

[General]
# Halt command
HaltCommand=/usr/bin/systemctl poweroff

# Reboot command
RebootCommand=/usr/bin/systemctl reboot

# Suspend command
SuspendCommand=/usr/bin/systemctl suspend

# Hydrate command
HydrateCommand=/usr/bin/systemctl hibernate

[Wayland]
# Enable Wayland backend (experimental)
CompositorCommand=weston --shell=fullscreen-shell.so

[X11]
# X server command
ServerPath=/usr/bin/X
ServerArguments=-nolisten tcp -noreset
DisplayCommand=/usr/share/sddm/scripts/Xsetup
DisplayStopCommand=/usr/share/sddm/scripts/Xstop

[Users]
# Default user avatar
AvatarImage=/usr/share/pixmaps/faces/default.png

# Minimum UID for user list
MinimumUID=1000

# Hide users with UID below threshold
HideShells=/sbin/nologin

[Autologin]
# Autologin settings (disabled by default)
Relogin=false
Session=hyprland
User=
