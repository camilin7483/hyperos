# HyperOS Custom Pacman Configuration
# This configuration is used for building the ISO and in the installed system

[options]
Architecture = auto
HoldPkg     = pacman glibc systemd
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5

# HyperOS Repository (local, will be populated during build)
[hyperos]
SigLevel = Optional TrustAll
Server = file:///run/archiso/airootfs/repo

# Official Arch Linux repositories
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
