# XDG Desktop Portal Configuration for HyperOS

[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.PermissionStore=xdg-desktop-portal-gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.OpenUri=gtk
org.freedesktop.impl.portal.Print=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.InputCapture=hyprland
org.freedesktop.impl.portal.RemoteDesktop=hyprland
org.freedesktop.impl.portal.Inhibit=gtk
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.Background=gtk
org.freedesktop.impl.portal.Lockdown=gtk
org.freedesktop.impl.portal.Wallpaper=gtk
org.freedesktop.impl.portal.Account=gtk
org.freedesktop.impl.portal.Email=gtk
org.freedesktop.impl.portal.DynamicLauncher=gtk

[use]
# Use GTK portal for most functionality
FileChooser=gtk
OpenUri=gtk
Print=gtk
Notification=gtk
Inhibit=gtk
Settings=gtk
Background=gtk
Lockdown=gtk
Wallpaper=gtk
Account=gtk
Email=gtk
DynamicLauncher=gtk

# Use Hyprland portal for Wayland-specific features
Screenshot=hyprland
ScreenCast=hyprland
InputCapture=hyprland
RemoteDesktop=hyprland

# Use GNOME Keyring for secrets
Secret=gnome-keyring
