# Hyperland Configuration for HyperOS
# Main configuration file

# ===========================
# GENERAL SETTINGS
# ===========================

general {
    # Disable hyprland's default keybinds to use our own
    disable_hyprland_keys = true
    
    # Mouse settings
    follow_mouse = 1
    mouse_refocus = false
    
    # Sensitivity
    sensitivity = 1.0
    
    # Focus settings
    focus_on_activate = true
    no_focus_fallback = false
    
    # Layout
    layout = dwindle
    
    # Allow tearing (optional, can cause issues)
    allow_tearing = false
}

# ===========================
# INPUT DEVICES
# ===========================

input {
    kb_layout = us
    kb_variant = 
    kb_model = 
    kb_options = 
    kb_rules = 
    
    repeat_rate = 50
    repeat_delay = 300
    
    follow_mouse = 1
    
    touchpad {
        natural_scroll = true
        clickfinger_behavior = true
        tap-to-click = true
        drag_lock = false
    }
    
    force_no_accel = 1
}

# ===========================
# DWINDLE LAYOUT
# ===========================

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = true
    smart_resizing = true
    no_gaps_when_only = 0
    split_width_multiplier = 1.0
    use_active_for_splits = true
    default_split_ratio = 1.0
}

# ===========================
# MASTER LAYOUT (alternative)
# ===========================

master {
    new_status = master
    new_on_top = true
    orientation = left
    inherit_fullscreen = true
    always_center_master = false
}

# ===========================
# ANIMATIONS
# ===========================

animations {
    enabled = true
    
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = myBezier2, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    
    animation = windows, 1, 6, myBezier
    animation = windowsOut, 1, 6, myBezier, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 100, linear, loop
    animation = fade, 1, 8, myBezier2
    animation = workspaces, 1, 5, overshot, slide
    animation = specialWorkspace, 1, 5, overshot, slidefadevert 30%
}

# ===========================
# DECORATIONS
# ===========================

decoration {
    rounding = 8
    
    # Blur
    blur {
        enabled = true
        size = 4
        passes = 3
        contrast = 0.8
        brightness = 0.8
        xray = true
        ignore_opacity = true
        new_optimizations = true
        popups = true
        layers = active
    }
    
    # Shadow
    drop_shadow = true
    shadow_range = 20
    shadow_render_power = 3
    col.shadow = rgba(00000066)
    col.shadow_inactive = rgba(00000044)
    
    # Dimming
    dim_inactive = false
    dim_strength = 0.2
    dim_special = 0.4
    
    # Border
    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0
    
    # Border settings
    col.border_active = rgba(7ebae4ff)
    col.border_inactive = rgba(333333ff)
    border_size = 2
}

# ===========================
# GESTURES
# ===========================

gestures {
    workspace_swipe = true
    workspace_swipe_distance = 500
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 10
    workspace_swipe_direction_lock = true
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_create_new = true
}

# ===========================
# MISCELLANEOUS
# ===========================

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    
    vfr = true
    vrr = 0
    
    enable_swallow = false
    swallow_regex = (kitty|foot|alacritty|wezterm)
    
    focus_on_activate = true
    
    new_window_takes_over_fullscreen = 2
    
    middle_click_paste = false
    
    initial_workspace_tracking = true
    
    mouse_move_enables_dpms = false
    key_press_enables_dpms = false
}

# ===========================
# AUTO START
# ===========================

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyperctl reload
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = waybar
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ===========================
# KEYBINDINGS
# ===========================

# Super key modifier
$mainMod = SUPER

# Basic keybindings
bind = $mainMod, Q, exec, alacritty
bind = $mainMod, C, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating, 
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, P, pseudo, 
bind = $mainMod, J, togglesplit, 

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspaces
bind = $mainMod ALT, S, movetoworkspacesilent, special
bind = $mainMod, S, togglespecialworkspace, 

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshot bindings
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, PRINT, exec, grim ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png

# Lock screen
bind = $mainMod, L, exec, swaylock

# HyperOS applications
bind = $mainMod, H, exec, hyper-center
bind = $mainMod SHIFT, H, exec, hyper-settings
bind = $mainMod, A, exec, hyper-assistant

# ===========================
# WINDOW RULES
# ===========================

# Float specific apps
windowrule = float, title:(Open File|Save As|Select a File)
windowrule = center, title:(Open File|Save As|Select a File)

# Make some apps floating by class
windowrule = float, pavucontrol
windowrule = float, blueman-manager
windowrule = float, nm-connection-editor

# Center floating windows
windowrule = center, pavucontrol
windowrule = center, blueman-manager

# Fullscreen on startup
windowrule = fullscreen, org.gnome.Settings
windowrule = fullscreen, hyper-welcome

# Remove borders for specific apps
windowrule = noblur, .*
windowrule = noshadow, .*

# ===========================
# LAYER RULES
# ===========================

layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, swaylock
layerrule = ignorezero, swaylock
layerrule = blur, wofi
layerrule = ignorezero, wofi

# ===========================
# SUBMAPS (for complex workflows)
# ===========================

# Resize mode
bind = $mainMod, R, submap, resize
submap = resize
binde = , right, resizeactive, 20 0
binde = , left, resizeactive, -20 0
binde = , up, resizeactive, 0 -20
binde = , down, resizeactive, 0 20
bind = , escape, submap, reset
submap = reset
