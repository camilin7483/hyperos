[SDDM]
# SDDM Theme Configuration for HyperOS

[General]
# Background image
background=/usr/share/wallpapers/hyperos-default.jpg

# Font
font=Noto Sans,12,-1,5,50,0,0,0,0,0

# Main color (HyperOS blue)
color=#7eaee4

# Error color
errorColor=#f38ba8

# Layout direction
layoutDirection=LeftToRight

# Locale
locale=

# Translate to system language
translateSystemLocale=true

# Theme cursor
cursorTheme=breeze_cursors

# Enable touchpad tapping
touchpadTap=true

# Automatic login (disabled by default)
# automaticLogin=
# autoLoginUser=
# autoLoginSession=HyperOS

# Display power management
displayPoweroffDelay=600

# Greeter environment
greeterEnvironment=QT_QPA_PLATFORM=xcb

# Input method
inputMethod=qtvirtualkeyboard

# NumLock state (on/off/none)
numlock=none

# Remember last user
rememberLastUser=true

# Remember last session
rememberLastSession=true

# Session command
sessionCommand=/usr/bin/Hyprland

# Shutdown command
shutdownCommand=/usr/bin/systemctl poweroff

# Reboot command
rebootCommand=/usr/bin/systemctl reboot

# Suspend command
suspendCommand=/usr/bin/systemctl suspend

# Hibernate command
hibernateCommand=/usr/bin/systemctl hibernate

# Hybrid sleep command
hybridSleepCommand=/usr/bin/systemctl hybrid-sleep
