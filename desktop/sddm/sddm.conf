[SDDM]
# Enable Wayland session (experimental)
EnableWayland=false

# Display settings
Width=1920
Height=1080
Theme=hyperos
ColorDepth=32

# Input method
InputMethod=qtvirtualkeyboard

# Virtual keyboard
VirtualKeyboard=

# Session command
SessionCommand=/usr/bin/HyperOS

# Remember last user/session
RememberLastUser=true
RememberLastSession=true

# Auto login (disabled by default)
# AutomaticLogin=
# AutologinSession=HyperOS

[General]
# Hide users with UIDs less than
HideUsers=0

# Allow passwordless login
AllowEmptyPassword=false

# Default username (if only one user)
# DefaultUsername=

# Number of users to show
NumUsers=100

[UI]
# Hide power buttons
HidePowerButtons=false

# Power button actions
PowerButtonAction=shutdown

# Show system shutdown/restart
ShowSystemShutdown=true
ShowSystemRestart=true
ShowSystemSuspend=true
ShowSystemHibernate=true

[Users]
# Maximum icon size
MaximumIconSize=120

# Minimum icon size
MinimumIconSize=32

# Avatar path
AvatarPath=/home

# Disable avatars
DisableAvatarsThreshold=5
