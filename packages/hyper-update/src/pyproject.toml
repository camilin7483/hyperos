[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
[project]
name = "hyper-update"
version = "0.1.0"
description = "HyperOS system updater"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "HyperOS Team" }]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "hyperos-core>=0.1.0"]
[project.scripts]
hyper-update = "hyper_update.app:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["hyper_update*"]
