[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperos-daemon"
version = "0.1.0"
description = "HyperOS central system daemon"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "HyperOS Team" }]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "hyperos-core>=0.1.0",
]

[project.optional-dependencies]
dbus = [
    "dbus-python>=1.3",
    "PyGObject>=3.44",
]

[project.scripts]
hyperos-daemon = "hyperos_daemon.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hyperos_daemon*"]
