[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-welcome"
version = "0.1.0"
description = "HyperOS first-boot welcome screen"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "HyperOS Team" },
]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
hyper-welcome = "hyper_welcome.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hyper_welcome*"]
